[project]
name = "swarmfs-trails"
version = "0.1.0"
description = "Small, budget-limited CooperBench activity-trail experiment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
swarm-trails = "bench.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
benchmark = [
    "httpx>=0.28,<0.29",
    "litellm==1.104.3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmfs", "bench"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "bench/tests"]
